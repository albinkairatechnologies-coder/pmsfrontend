name: Build Android APK (Online Cloud Build)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger of the build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Compile Next.js Static Assets
        # This will export the web assets into the 'out' directory for Capacitor
        run: npm run build
        env:
          BUILD_MOBILE: 'true'
          NEXT_PUBLIC_API_URL: 'https://kairavcard.com/api'

      - name: Sync Web Assets to Android Project
        run: npx cap sync

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kairaflow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
